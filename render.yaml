services:
  - type: web
    name: peer-share
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: "production"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: SERVE_CLIENT
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: "smtp-relay.brevo.com"
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STUN_URLS
        value: "stun:stun.cloudflare.com:3478"
      - key: ICE_RELAY_ONLY
        value: "false"